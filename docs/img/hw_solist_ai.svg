<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 690" font-family="Yu Gothic UI, Meiryo, Segoe UI, sans-serif">
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#1565c0"/></marker><style>.t{font-size:20px;font-weight:800;fill:#172033}.p{font-size:16px;font-weight:800}.b{font-size:12px;font-weight:700}.s{font-size:10px;fill:#5c6b7b}.box{stroke-width:1.4}.w{fill:none;stroke:#1565c0;stroke-width:2;marker-end:url(#a)}.l{font-size:10px;font-weight:700;fill:#1565c0}</style></defs>
  <text class="t" x="560" y="30" text-anchor="middle">IchiPing Solist-AI 実機構成</text>
  <text class="s" x="560" y="50" text-anchor="middle">推論: PCMを基準、条件付きでStamp FFT特徴 / 学習: Stamp USBからPCへPCM原本</text>

  <rect x="30" y="80" width="275" height="430" rx="14" fill="#fce8f1" stroke="#c32669" stroke-width="2"/>
  <text class="p" x="167" y="112" text-anchor="middle" fill="#8d174c">M5Stack Stamp-S3A</text>
  <text class="s" x="167" y="132" text-anchor="middle">左1x17 P1.27 + 右1x6 P2.54 / I²C target</text>
  <rect class="box" x="55" y="155" width="225" height="68" rx="8" fill="#fff" stroke="#d9822b"/>
  <text class="b" x="167" y="181" text-anchor="middle" fill="#a75808">I²S TX/RX 同期</text>
  <text class="s" x="167" y="201" text-anchor="middle">PRBS再生 + マイク収録 + shutdown</text>
  <rect class="box" x="55" y="245" width="225" height="82" rx="8" fill="#fff" stroke="#1f8a5b"/>
  <text class="b" x="167" y="271" text-anchor="middle" fill="#176b43">音響フロントエンド</text>
  <text class="s" x="167" y="291" text-anchor="middle">48→16 kHz / mono / onset整列</text>
  <text class="s" x="167" y="309" text-anchor="middle">PCM16保持 / 条件付きD=167特徴</text>
  <rect class="box" x="55" y="350" width="225" height="62" rx="8" fill="#fff" stroke="#c32669"/>
  <text class="b" x="167" y="376" text-anchor="middle" fill="#8d174c">5状態GPIO + EXEC</text>
  <text class="s" x="167" y="396" text-anchor="middle">G44/G2/G4/G6/G8 + G10</text>
  <text class="s" x="167" y="452" text-anchor="middle">INFERENCE: I²C PCM / 特徴chunk</text>
  <text class="s" x="167" y="471" text-anchor="middle">TRAINING: USB CDC → PC</text>

  <rect x="370" y="65" width="410" height="460" rx="14" fill="#eef4fb" stroke="#1565c0" stroke-width="2"/>
  <text class="p" x="575" y="98" text-anchor="middle" fill="#1565c0">DT-EBML63Q2557 / Solist-AI</text>
  <text class="s" x="575" y="118" text-anchor="middle">I²C master・標準化・ELM・システム状態</text>
  <rect class="box" x="400" y="150" width="350" height="74" rx="8" fill="#f2ebff" stroke="#7954c8"/>
  <text class="b" x="575" y="177" text-anchor="middle" fill="#55349d">共用 I²C master（最大400 kHz）</text>
  <text class="s" x="575" y="198" text-anchor="middle">Stamp-S3A + PCA9685 + onboard LCD</text>
  <rect class="box" x="400" y="247" width="350" height="84" rx="8" fill="#e7f6ec" stroke="#1f8a5b"/>
  <text class="b" x="575" y="274" text-anchor="middle" fill="#17643f">PCM → FFT → 標準化 / 特徴 → 標準化</text>
  <text class="s" x="575" y="295" text-anchor="middle">いずれもSolist固定β ELMへ入力</text>
  <text class="s" x="575" y="313" text-anchor="middle">PC学習済み固定βで推論のみ</text>
  <rect class="box" x="400" y="354" width="165" height="82" rx="8" fill="#e9f2ff" stroke="#3678c7"/>
  <text class="b" x="482" y="381" text-anchor="middle" fill="#184f91">SPI TFT</text>
  <text class="s" x="482" y="402" text-anchor="middle">ILI9341表示</text>
  <text class="s" x="482" y="419" text-anchor="middle">状態 / result</text>
  <rect class="box" x="585" y="354" width="165" height="82" rx="8" fill="#fff3d7" stroke="#d88b00"/>
  <text class="b" x="667" y="381" text-anchor="middle" fill="#8c5900">I²Cサーボ</text>
  <text class="s" x="667" y="402" text-anchor="middle">PCA9685 → SG90×5</text>
  <text class="s" x="667" y="419" text-anchor="middle">arming / FULL_OFF</text>
  <text class="s" x="575" y="477" text-anchor="middle">PCM 64KBは一括保持しない</text>
  <text class="s" x="575" y="496" text-anchor="middle">音声転送中はLCD/PCA書込みを時分割停止</text>

  <rect x="845" y="80" width="245" height="430" rx="14" fill="#fffaf2" stroke="#d9822b" stroke-width="2"/>
  <text class="p" x="967" y="112" text-anchor="middle" fill="#a75808">音響・機構</text>
  <rect class="box" x="870" y="155" width="195" height="68" rx="8" fill="#fff" stroke="#1f8a5b"/>
  <text class="b" x="967" y="181" text-anchor="middle" fill="#176b43">I²Sデジタルマイク</text>
  <text class="s" x="967" y="201" text-anchor="middle">24 significant bits</text>
  <rect class="box" x="870" y="245" width="195" height="82" rx="8" fill="#fff" stroke="#d9822b"/>
  <text class="b" x="967" y="271" text-anchor="middle" fill="#a75808">I²S AMP + speaker</text>
  <text class="s" x="967" y="291" text-anchor="middle">PRBS励振</text>
  <text class="s" x="967" y="309" text-anchor="middle">shutdown外付けpull-down</text>
  <rect class="box" x="870" y="350" width="195" height="82" rx="8" fill="#fff" stroke="#7954c8"/>
  <text class="b" x="967" y="376" text-anchor="middle" fill="#55349d">PCA9685 + SG90×5</text>
  <text class="s" x="967" y="397" text-anchor="middle">I²C / PWM</text>
  <text class="s" x="967" y="415" text-anchor="middle">外部5V + 共通GND</text>

  <path class="w" d="M305 285H345V187H400"/><text class="l" x="316" y="274">推論I²C: PCM/特徴</text>
  <path class="w" d="M845 189H810V188H305"/><text class="l" x="793" y="178">I²S RX</text>
  <path class="w" d="M305 205H820V286H870"/><text class="l" x="798" y="276">I²S TX</text>
  <path class="w" d="M750 395H870"/><text class="l" x="801" y="385">I²C</text>
  <rect class="box" x="30" y="540" width="275" height="65" rx="10" fill="#fce8f1" stroke="#c32669"/>
  <text class="b" x="167" y="565" text-anchor="middle" fill="#8d174c">PC collector / trainer</text>
  <text class="s" x="167" y="584" text-anchor="middle">USB CDC: PCM16 + label + metadata</text>
  <path class="w" d="M167 510V538"/><text class="l" x="179" y="529">USB</text>
  <rect x="330" y="540" width="760" height="65" rx="8" fill="#fff7e6" stroke="#d9b65d"/>
  <text class="s" x="710" y="565" text-anchor="middle">INFERENCE: 既定64KB PCM / 条件付き668B D=167特徴をI²C転送。</text>
  <text class="s" x="710" y="584" text-anchor="middle">TRAINING: 64KB PCMを4KiB chunkのUSB CDCでPCへ直送し、PCでβを学習・検証・配備。</text>
  <rect x="30" y="625" width="1060" height="48" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text class="s" x="560" y="647" text-anchor="middle">学習と推論は排他。特徴転送は推論時だけで、学習用bulk PCMはI²Cへ流さない。</text>
  <text class="s" x="560" y="664" text-anchor="middle">PC ACKまでbufferを保持し、capture ID・状態・offset・CRCで欠落と重複を検査する。</text>
</svg>
