<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc" font-family="'Yu Gothic UI','Meiryo','Segoe UI',sans-serif">
  <title id="title">IchiPing Solist-AI 最終ハードウェア接続図</title>
  <desc id="desc">DT-EBML63Q2557とM5Stack Stamp-S3をUARTと同期GPIOで接続し、Stamp-S3からI2Sアンプとスピーカーを駆動する。アナログマイクはプリアンプを介して主ボードのCN6へ接続する。</desc>
  <defs>
    <style>
      .title{font-size:27px;font-weight:800;fill:#172033}.sub{font-size:13px;fill:#5c6b7b}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.main{fill:#183b66;stroke:#102a49;stroke-width:2}
      .child{fill:#fce8f1;stroke:#c32669;stroke-width:2}.audio{fill:#fff1df;stroke:#d9822b;stroke-width:1.7}
      .sense{fill:#e7f7ed;stroke:#24915d;stroke-width:1.7}.power{fill:#f2ebff;stroke:#7954c8;stroke-width:1.5}
      .head{font-size:17px;font-weight:800}.label{font-size:12px;font-weight:700}.small{font-size:10px}.white{fill:#fff}.muted{fill:#5c6b7b}
      .wire{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.uart{stroke:#b32672}.sync{stroke:#1565c0}.i2s{stroke:#d9822b}.analog{stroke:#24915d}.acoustic{stroke:#687789;stroke-dasharray:7 5}
    </style>
    <marker id="a-uart" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b32672"/></marker>
    <marker id="a-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#1565c0"/></marker>
    <marker id="a-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d9822b"/></marker>
    <marker id="a-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#24915d"/></marker>
    <marker id="a-gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#687789"/></marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#f7f9fc"/>
  <text class="title" x="600" y="42" text-anchor="middle">IchiPing → Solist-AI 最終ハードウェア構成</text>
  <text class="sub" x="600" y="66" text-anchor="middle">主ボードで収録・追加学習・推論／Stamp-S3でPRBS生成・I²S出力／降雨センサなし</text>
  <rect class="panel" x="34" y="92" width="1132" height="535" rx="16"/>

  <rect class="main" x="74" y="155" width="330" height="300" rx="15"/>
  <text class="head white" x="239" y="187" text-anchor="middle">DT-EBML63Q2557</text>
  <text x="239" y="210" text-anchor="middle" font-size="12" fill="#d7e8ff">ML63Q2557 / Cortex-M0+ 48MHz</text>
  <rect x="96" y="231" width="286" height="67" rx="9" fill="#dff3e6" stroke="#238657"/>
  <text x="239" y="256" text-anchor="middle" font-size="13" font-weight="800" fill="#17643f">AxlCORE-ODL</text>
  <text x="239" y="278" text-anchor="middle" font-size="11" fill="#315d49">ELM推論・β追加学習</text>
  <rect x="96" y="314" width="136" height="68" rx="8" fill="#eef4fb" stroke="#79aee9"/>
  <text x="164" y="340" text-anchor="middle" class="label" fill="#184f91">12bit ADC</text>
  <text x="164" y="362" text-anchor="middle" class="small muted">CN6 / 16kHz収録</text>
  <rect x="246" y="314" width="136" height="68" rx="8" fill="#eef4fb" stroke="#79aee9"/>
  <text x="314" y="340" text-anchor="middle" class="label" fill="#184f91">前処理</text>
  <text x="314" y="362" text-anchor="middle" class="small muted">差分・FFT・z-score</text>
  <text x="239" y="418" text-anchor="middle" font-size="11" fill="#d7e8ff">βfactory保持 ＋ βlocal別保存</text>

  <rect class="child" x="472" y="155" width="270" height="300" rx="15"/>
  <text class="head" x="607" y="187" text-anchor="middle" fill="#8d174c">M5Stack Stamp-S3</text>
  <text x="607" y="210" text-anchor="middle" font-size="12" fill="#85405e">ESP32-S3 / 240MHz / 8MB Flash</text>
  <rect x="494" y="231" width="226" height="63" rx="9" fill="#fff" stroke="#e3a6c0"/>
  <text x="607" y="256" text-anchor="middle" class="label" fill="#8d174c">UART制御</text>
  <text x="607" y="278" text-anchor="middle" class="small muted">seed・長さ・振幅・状態通知</text>
  <rect x="494" y="309" width="226" height="63" rx="9" fill="#fff" stroke="#e3a6c0"/>
  <text x="607" y="334" text-anchor="middle" class="label" fill="#8d174c">PRBS生成＋I²S DMA</text>
  <text x="607" y="356" text-anchor="middle" class="small muted">16kHz / 16bit / mono</text>
  <rect x="494" y="387" width="226" height="45" rx="8" fill="#e9f2ff" stroke="#79aee9"/>
  <text x="607" y="415" text-anchor="middle" class="label" fill="#184f91">PLAY_SYNC生成</text>

  <rect class="audio" x="813" y="155" width="190" height="125" rx="13"/>
  <text class="head" x="908" y="187" text-anchor="middle" fill="#a75808">MAX98357A</text>
  <text x="908" y="210" text-anchor="middle" class="label" fill="#805b35">I²S DAC＋Class-D</text>
  <text x="908" y="235" text-anchor="middle" class="small muted">BCLK / LRC / DIN / SD</text>
  <text x="908" y="255" text-anchor="middle" class="small muted">5V電源</text>
  <rect class="audio" x="1032" y="155" width="100" height="125" rx="13"/>
  <text x="1082" y="190" text-anchor="middle" class="label" fill="#a75808">スピーカー</text>
  <text x="1082" y="214" text-anchor="middle" class="small muted">8Ω / 1W</text>
  <circle cx="1082" cy="247" r="19" fill="#29323f"/><circle cx="1082" cy="247" r="8" fill="#fff1df"/>

  <rect class="sense" x="813" y="358" width="150" height="97" rx="13"/>
  <text x="888" y="388" text-anchor="middle" class="label" fill="#176b43">アナログマイク</text>
  <text x="888" y="411" text-anchor="middle" class="small muted">固定ゲイン</text>
  <text x="888" y="430" text-anchor="middle" class="small muted">AGCなし</text>
  <rect class="sense" x="1000" y="358" width="132" height="97" rx="13"/>
  <text x="1066" y="388" text-anchor="middle" class="label" fill="#176b43">プリアンプ</text>
  <text x="1066" y="411" text-anchor="middle" class="small muted">ADC範囲へ調整</text>
  <text x="1066" y="430" text-anchor="middle" class="small muted">低ノイズ</text>

  <path class="wire uart" d="M404 250H472" marker-end="url(#a-uart)"/>
  <path class="wire uart" d="M472 278H404" marker-end="url(#a-uart)"/>
  <text x="438" y="239" text-anchor="middle" class="label" fill="#b32672">UART TX/RX</text>
  <path class="wire sync" d="M472 410H404" marker-end="url(#a-blue)"/>
  <text x="438" y="400" text-anchor="middle" class="label" fill="#1565c0">SYNC</text>
  <path class="wire i2s" d="M742 217H813" marker-end="url(#a-orange)"/>
  <text x="777" y="205" text-anchor="middle" class="label" fill="#d9822b">I²S</text>
  <path class="wire i2s" d="M1003 217H1032" marker-end="url(#a-orange)"/>
  <text x="1018" y="205" text-anchor="middle" class="small" fill="#d9822b">BTL</text>
  <path class="wire analog" d="M1000 406H963" marker-end="url(#a-green)"/>
  <path class="wire analog" d="M813 406H778V489H164V382" marker-end="url(#a-green)"/>
  <text x="590" y="479" text-anchor="middle" class="label" fill="#24915d">アナログ音声 → CN6</text>
  <path class="wire acoustic" d="M1082 281V318H888V356" marker-end="url(#a-gray)"/>
  <text x="985" y="310" text-anchor="middle" class="label" fill="#687789">室内音響・反射音</text>

  <rect class="power" x="74" y="518" width="1058" height="76" rx="11"/>
  <text x="96" y="546" class="label" fill="#55349d">電源・信号基準</text>
  <text x="96" y="570" font-size="11" fill="#675681">Stamp-S3とMAX98357Aは5V系。全ブロックのGNDを共通化し、アンプ大電流経路とADCアナログ配線を分離。ML63側UART電圧を実測し、3.3V以外ならレベル変換を追加。</text>

  <g transform="translate(75 660)">
    <line class="wire uart" x1="0" y1="0" x2="28" y2="0"/><text x="38" y="4" font-size="11" fill="#344054">UART制御</text>
    <line class="wire sync" x1="150" y1="0" x2="178" y2="0"/><text x="188" y="4" font-size="11" fill="#344054">同期GPIO</text>
    <line class="wire i2s" x1="300" y1="0" x2="328" y2="0"/><text x="338" y="4" font-size="11" fill="#344054">I²S / スピーカー</text>
    <line class="wire analog" x1="500" y1="0" x2="528" y2="0"/><text x="538" y="4" font-size="11" fill="#344054">アナログ収録</text>
    <line class="wire acoustic" x1="680" y1="0" x2="708" y2="0"/><text x="718" y="4" font-size="11" fill="#344054">音響経路</text>
  </g>
</svg>
