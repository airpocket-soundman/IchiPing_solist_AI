; Stamp-S3A measurement server for the Solist-AI (IchiPing).
; Plays the UNO Q PRBS on the MAX98357A, records the INMP441, and serves the aligned
; 2.0 s 16 kHz frame to the Solist over I2C (slave 0x42).  Also reports the door /
; window switches and EXEC.  data/*.bin are generated by tools/make_prbs.py.
[env:stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/make_prbs.py
board_build.embed_files =
    data/prbs48k.bin
    data/prbs_chips.bin
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
