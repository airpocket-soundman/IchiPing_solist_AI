; Stamp-S3A INMP441 microphone bring-up test (level meter + 2 s recording over USB CDC).
; Pins follow docs/io_allocation.md: BCLK G43, WS G5, mic SD -> G9, amp SD_MODE G1 held Low.
[env:stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
