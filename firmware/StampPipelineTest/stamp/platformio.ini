; Stamp-S3A PCM server for the Solist-AI pipeline test.
; data/clips.bin (recorded 16 kHz PCM16, ~2.7 MB) is generated by tools/make_clips.py
; from samples/uno_q_eval_evening and embedded into the application image.
[env:stamps3]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/make_clips.py
board_build.embed_files = data/clips.bin
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
