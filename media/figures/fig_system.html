<!doctype html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:#fff}
svg{font-family:"Noto Sans JP","Yu Gothic",sans-serif}
.t{font-size:22px;fill:#1f2933}
.s{font-size:18px;fill:#52606d}
.h{font-size:26px;font-weight:700}
.lab{font-size:17px;font-weight:700}
</style></head><body>
<svg width="1600" height="960" viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07b14"/></marker>
 <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d5fa8"/></marker>
 <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f8a57"/></marker>
 <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7b8794"/></marker>
</defs>
<text x="40" y="52" font-size="34" font-weight="700" fill="#102a43">システム構成と役割分担</text>
<text x="40" y="84" class="s">音を出す・拾う(I²S)とスイッチ入力(GPIO)だけを Stamp-S3A が補い、信号処理・AI・学習・制御は Solist-AI 上で動く</text>

<!-- GPIO route (top) -->
<path d="M1440 150 V112 H545 V150" fill="none" stroke="#2f8a57" stroke-width="3" marker-end="url(#ag)"/>
<rect x="880" y="99" width="250" height="26" rx="4" fill="#fff"/>
<text x="1005" y="118" text-anchor="middle" class="lab" fill="#2f8a57">GPIO:トグル×5・EXEC</text>

<!-- House -->
<rect x="40" y="150" width="300" height="520" rx="16" fill="#eef8f1" stroke="#2f8a57" stroke-width="2.5"/>
<text x="190" y="192" text-anchor="middle" class="h" fill="#1e6b40">House 模型</text>
<text x="190" y="220" text-anchor="middle" class="s">3 部屋・3D プリント</text>
<rect x="64" y="245" width="252" height="70" rx="10" fill="#fff" stroke="#9fd3b3"/>
<text x="190" y="276" text-anchor="middle" class="t">スピーカ</text><text x="190" y="302" text-anchor="middle" class="s">Room A・Ping を出す</text>
<rect x="64" y="330" width="252" height="70" rx="10" fill="#fff" stroke="#9fd3b3"/>
<text x="190" y="361" text-anchor="middle" class="t">マイク INMP441</text><text x="190" y="387" text-anchor="middle" class="s">Room A・反響を聴く</text>
<rect x="64" y="440" width="252" height="200" rx="10" fill="#fff" stroke="#9fd3b3"/>
<text x="190" y="474" text-anchor="middle" class="t">サーボ SG90 ×5</text>
<text x="190" y="502" text-anchor="middle" class="s">窓 a / b / c</text>
<text x="190" y="528" text-anchor="middle" class="s">扉 AB / BC</text>
<text x="190" y="566" text-anchor="middle" class="s">2⁵ = 32 通りの状態を</text>
<text x="190" y="592" text-anchor="middle" class="s">機械的に作れる</text>

<!-- Stamp -->
<rect x="400" y="150" width="290" height="520" rx="16" fill="#fff6ec" stroke="#e07b14" stroke-width="2.5"/>
<text x="545" y="192" text-anchor="middle" class="h" fill="#b35c00">Stamp-S3A</text>
<text x="545" y="220" text-anchor="middle" class="s">I/O の補完役</text>
<g class="t">
<text x="424" y="270">・I²S 全二重</text>
<text x="446" y="298" class="s">アンプ MAX98357A と</text>
<text x="446" y="322" class="s">マイクを同一クロックで</text>
<text x="424" y="366">・PRBS 2 秒を再生し</text>
<text x="446" y="394">同時に録音</text>
<text x="424" y="438">・48→16 kHz 変換と</text>
<text x="446" y="466">開始位置の整列</text>
<text x="424" y="510">・トグル / EXEC の</text>
<text x="446" y="538">読み取り</text>
</g>
<rect x="424" y="580" width="242" height="60" rx="10" fill="#fde3c8"/>
<text x="545" y="608" text-anchor="middle" class="lab" fill="#8a4300">FFT も推論もしない</text>
<text x="545" y="630" text-anchor="middle" font-size="15" fill="#8a4300">(評価ボードに I²S が無いため)</text>

<!-- I2S arrows -->
<path d="M400 280 H318" stroke="#e07b14" stroke-width="3" marker-end="url(#ao)"/>
<path d="M318 365 H400" stroke="#e07b14" stroke-width="3" marker-end="url(#ao)"/>
<text x="359" y="270" text-anchor="middle" class="lab" fill="#e07b14">I²S</text>

<!-- Solist -->
<rect x="760" y="140" width="500" height="580" rx="18" fill="#eaf2fb" stroke="#1d5fa8" stroke-width="4"/>
<text x="1010" y="184" text-anchor="middle" font-size="28" font-weight="700" fill="#0f3d73">Solist-AI 評価ボード</text>
<text x="1010" y="212" text-anchor="middle" class="s">DT-EBML63Q2557(ML63Q2557)― コア処理はすべてここ</text>
<rect x="784" y="232" width="452" height="100" rx="10" fill="#fff" stroke="#9cc0e8"/>
<text x="800" y="262" class="lab" fill="#1d5fa8">① 信号処理(CPU・int16 固定小数点)</text>
<text x="800" y="292" class="t">2048 点 FFT → Welch パワー → dB</text>
<text x="800" y="320" class="t">→ 全閉との差分 → 334 次元 int8</text>
<rect x="784" y="344" width="452" height="100" rx="10" fill="#fff" stroke="#9cc0e8"/>
<text x="800" y="374" class="lab" fill="#1d5fa8">② AI 推論(CPU + AxlCORE)</text>
<text x="800" y="404" class="t">int8 CNN 前段(Cortex-M0+)</text>
<text x="800" y="432" class="t">→ ELM ヘッド(AxlCORE)→ 32 状態</text>
<rect x="784" y="456" width="452" height="100" rx="10" fill="#fff" stroke="#1d5fa8" stroke-width="2.5"/>
<text x="800" y="486" class="lab" fill="#1d5fa8">③ その場で学習(現地校正)</text>
<text x="800" y="516" class="t">OS-ELM で β を逐次更新(float32)</text>
<text x="800" y="544" class="t">→ AxlCORE へ書き戻す(P と β は FRAM)</text>
<rect x="784" y="568" width="452" height="72" rx="10" fill="#fff" stroke="#9cc0e8"/>
<text x="800" y="598" class="lab" fill="#1d5fa8">④ システム制御</text>
<text x="800" y="626" class="t">TFT 表示・サーボ駆動・状態管理</text>
<text x="1010" y="690" text-anchor="middle" class="s">SRAM 16 KB / Flash 256 KB に全部入り(RAM 使用 13.3 KB)</text>

<!-- Stamp <-> Solist I2C -->
<path d="M690 400 H758" stroke="#1d5fa8" stroke-width="3.5" marker-end="url(#ab)" marker-start="url(#ab)"/>
<text x="724" y="376" text-anchor="middle" class="lab" fill="#1d5fa8">I²C</text>
<text x="724" y="432" text-anchor="middle" font-size="14" fill="#1d5fa8">PCM</text>
<text x="724" y="450" text-anchor="middle" font-size="14" fill="#1d5fa8">32,000</text>
<text x="724" y="468" text-anchor="middle" font-size="14" fill="#1d5fa8">サンプル</text>

<!-- Panel -->
<rect x="1320" y="150" width="250" height="520" rx="16" fill="#f4f5f7" stroke="#52606d" stroke-width="2.5"/>
<text x="1445" y="192" text-anchor="middle" class="h" fill="#323f4b">操作盤</text>
<rect x="1340" y="220" width="210" height="96" rx="10" fill="#fff" stroke="#bcccdc"/>
<text x="1445" y="254" text-anchor="middle" class="t">ILI9341 TFT</text><text x="1445" y="282" text-anchor="middle" class="s">推論結果と正解</text><text x="1445" y="304" text-anchor="middle" class="s">を並べて表示</text>
<rect x="1340" y="330" width="210" height="96" rx="10" fill="#fff" stroke="#bcccdc"/>
<text x="1445" y="364" text-anchor="middle" class="t">トグル ×5</text><text x="1445" y="392" text-anchor="middle" class="s">開閉の指定</text><text x="1445" y="414" text-anchor="middle" class="s">＝正解ラベル</text>
<rect x="1340" y="440" width="210" height="96" rx="10" fill="#fff" stroke="#bcccdc"/>
<text x="1445" y="474" text-anchor="middle" class="t">EXEC ボタン</text><text x="1445" y="502" text-anchor="middle" class="s">押す：推論</text><text x="1445" y="524" text-anchor="middle" class="s">長押し：現地校正</text>
<rect x="1340" y="550" width="210" height="96" rx="10" fill="#fff" stroke="#bcccdc"/>
<text x="1445" y="584" text-anchor="middle" class="t">PCA9685</text><text x="1445" y="612" text-anchor="middle" class="s">サーボドライバ</text>

<path d="M1260 268 H1338" stroke="#1d5fa8" stroke-width="3" marker-end="url(#ab)"/>
<text x="1290" y="258" text-anchor="middle" class="lab" fill="#1d5fa8">SPI</text>
<path d="M1260 598 H1338" stroke="#1d5fa8" stroke-width="3" marker-end="url(#ab)"/>
<text x="1290" y="588" text-anchor="middle" class="lab" fill="#1d5fa8">I²C</text>
<!-- PWM route bottom -->
<path d="M1445 670 V752 H190 V642" fill="none" stroke="#2f8a57" stroke-width="3" marker-end="url(#ag)"/>
<rect x="640" y="739" width="190" height="26" rx="4" fill="#fff"/>
<text x="735" y="758" text-anchor="middle" class="lab" fill="#2f8a57">PWM ×5(サーボ)</text>

<!-- PC -->
<rect x="400" y="800" width="860" height="120" rx="14" fill="#fafbfc" stroke="#9aa5b1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="424" y="838" class="lab" fill="#52606d">PC(開発時だけ)</text>
<text x="424" y="870" class="t">ラベル付きデータの自動採取 → 事前学習 → Solist-AI へ書き込み</text>
<text x="424" y="900" class="s">運用中は PC 不要。環境が変わったら Solist-AI 単体で現地校正する</text>
<path d="M545 800 V672" stroke="#7b8794" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ak)"/>
<text x="555" y="790" font-size="15" fill="#7b8794">USB:録音ダンプ</text>
<path d="M1010 800 V722" stroke="#7b8794" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ak)"/>
<text x="1020" y="790" font-size="15" fill="#7b8794">UART:採取指令・書き込み</text>
</svg></body></html>
